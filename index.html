<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="p-4">
    <div class="container mx-auto max-w-6xl">
        <!-- Login Section -->
        <div id="loginSection" class="glass-effect rounded-xl p-8 mb-8">
            <h2 class="text-3xl font-bold text-white mb-6">Hostel Management System</h2>
            <form id="loginForm" class="space-y-4">
                <input type="text" placeholder="Username" class="w-full p-3 rounded" required>
                <input type="password" placeholder="Password" class="w-full p-3 rounded" required>
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Login</button>
            </form>
        </div>

        <!-- Student Registration -->
        <div id="registrationSection" class="glass-effect rounded-xl p-8 mb-8 hidden">
            <h3 class="text-2xl font-bold text-white mb-6">Student Registration</h3>
            <form id="registrationForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" placeholder="Full Name" class="p-3 rounded" required>
                <input type="text" placeholder="Roll Number" class="p-3 rounded" required>
                <select class="p-3 rounded" required>
                    <option value="">Select Branch</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ECE">Electronics</option>
                    <option value="ME">Mechanical</option>
                </select>
                <select class="p-3 rounded" required>
                    <option value="">Select Course</option>
                    <option value="BTech">B.Tech</option>
                    <option value="MTech">M.Tech</option>
                </select>
                <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition md:col-span-2">Register</button>
            </form>
        </div>

        <!-- Fees & Attendance Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-effect rounded-xl p-8">
                <h3 class="text-2xl font-bold text-white mb-6">Hostel Fees</h3>
                <div class="text-white">
                    <p class="mb-4">Annual Fees: ₹40,000</p>
                    <div class="space-y-2">
                        <p>Payment Schedule:</p>
                        <ul class="list-disc pl-5">
                            <li>First Installment: ₹20,000</li>
                            <li>Second Installment: ₹20,000</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="glass-effect rounded-xl p-8">
                <h3 class="text-2xl font-bold text-white mb-6">Attendance System</h3>
                <form id="attendanceForm" class="space-y-4">
                    <input type="date" class="w-full p-3 rounded">
                    <select class="w-full p-3 rounded">
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="leave">On Leave</option>
                    </select>
                    <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition w-full">Mark Attendance</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Toggle between login and registration
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registrationSection').classList.remove('hidden');
        });

        // Handle registration
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Registration successful!');
        });

        // Handle attendance
        document.getElementById('attendanceForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Attendance marked successfully!');
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
